<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Stress: the 3-minute strategy game. Raid the enemy half, rattle their pieces, crack their nerve. Ten rivals, daily puzzles, no ads.">
<meta name="theme-color" content="#D6E8E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08110E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stress">
<title>Stress</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="defs" aria-hidden="true"></div>
<main id="app">

  <!-- ===== HOME ===== -->
  <section class="screen" id="screen-home" aria-label="Home">
    <div class="home-top">
      <button class="profile-chip" id="h-profile" aria-label="Your profile and collection">
        <span class="avatar" id="h-avatar"></span>
        <span class="who"><span class="lvl" id="h-level">Level 1 · Rattled</span><span class="xpbar"><i id="h-xp"></i></span></span>
      </button>
      <button class="icon-btn" id="h-settings" aria-label="Settings"></button>
    </div>
    <div class="home-hero">
      <h1 class="wordmark">STRESS</h1>
      <p class="tagline">Keep calm. Stress them out.</p>
      <div class="parade" id="h-parade" aria-hidden="true"></div>
    </div>
    <button class="play-card" id="h-play"></button>
    <button class="daily-card" id="h-daily"></button>
    <div class="mode-grid">
      <button class="mode-tile" id="h-puzzles"><span class="ic" data-icon="puzzle"></span><span><b>Puzzles</b><span id="h-puzzles-sub"></span></span></button>
      <button class="mode-tile" id="h-rivals"><span class="ic" data-icon="ladder"></span><span><b>Rivals</b><span id="h-rivals-sub"></span></span></button>
      <button class="mode-tile" id="h-quick"><span class="ic" data-icon="swords"></span><span><b>Quick match</b><span id="h-quick-sub"></span></span></button>
      <button class="mode-tile" id="h-pvp"><span class="ic" data-icon="people"></span><span><b>Two players</b><span>One device</span></span></button>
    </div>
    <p class="credit">Made by Paul</p>
  </section>

  <!-- ===== RIVALS ===== -->
  <section class="screen" id="screen-rivals" aria-labelledby="rivals-title">
    <div class="topbar"><button class="icon-btn" data-back aria-label="Back"></button><h2 id="rivals-title">Rivals</h2><span class="spacer"></span></div>
    <div class="scroll"><div class="ladder-sum" id="rivals-sum"></div><div class="ladder" id="rivals-list"></div></div>
  </section>

  <!-- ===== PUZZLES ===== -->
  <section class="screen" id="screen-puzzles" aria-labelledby="puzzles-title">
    <div class="topbar"><button class="icon-btn" data-back aria-label="Back"></button><h2 id="puzzles-title">Puzzles</h2><span class="spacer"></span></div>
    <div class="scroll"><div id="puzzles-body"></div></div>
  </section>

  <!-- ===== COLLECTION ===== -->
  <section class="screen" id="screen-collection" aria-labelledby="collection-title">
    <div class="topbar"><button class="icon-btn" data-back aria-label="Back"></button><h2 id="collection-title">Collection</h2><span class="spacer"></span></div>
    <div class="scroll">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="themes" aria-selected="true">Boards</button>
        <button role="tab" data-tab="awards" aria-selected="false">Awards</button>
        <button role="tab" data-tab="stats" aria-selected="false">Stats</button>
      </div>
      <div id="collection-body"></div>
    </div>
  </section>

  <!-- ===== SETTINGS ===== -->
  <section class="screen" id="screen-settings" aria-labelledby="settings-title">
    <div class="topbar"><button class="icon-btn" data-back aria-label="Back"></button><h2 id="settings-title">Settings</h2><span class="spacer"></span></div>
    <div class="scroll"><div class="settings" id="settings-body"></div></div>
  </section>

  <!-- ===== HOW TO PLAY ===== -->
  <section class="screen" id="screen-rules" aria-labelledby="rules-title">
    <div class="topbar"><button class="icon-btn" data-back aria-label="Back"></button><h2 id="rules-title">How to play</h2><span class="spacer"></span></div>
    <div class="scroll"><div class="doc" id="rules-body"></div></div>
  </section>

  <!-- ===== TUTORIAL ===== -->
  <section class="screen game-layout" id="screen-tutorial" aria-label="Tutorial">
    <div class="g-top"><span class="spacer"></span><div class="g-title"><b>Learn Stress</b><span id="t-count">Lesson 1 of 5</span></div><button class="btn ghost small" id="t-skip">Skip</button></div>
    <div class="side top" data-side="red">
      <div class="face" id="t-opp-face"></div>
      <div class="nm">Red</div>
      <div class="num"><b id="t-stress-1">0</b><span>/10</span></div>
      <div class="meter-row"><div class="meter" id="t-meter-1"></div></div>
    </div>
    <div class="board-area"><div id="t-board"></div></div>
    <div class="side bottom" data-side="blue">
      <div class="face" id="t-me-face"></div>
      <div class="nm">You</div>
      <div class="num"><b id="t-stress-0">0</b><span>/10</span></div>
      <div class="meter-row"><div class="meter" id="t-meter-0"></div></div>
    </div>
    <div class="t-coach" id="t-coach" aria-live="polite"><p id="t-text"></p><button class="btn primary small" id="t-next" hidden>Next</button></div>
  </section>

  <!-- ===== GAME ===== -->
  <section class="screen game-layout" id="screen-game" aria-label="Game">
    <div class="g-top">
      <button class="icon-btn" id="g-menu" aria-label="Pause menu"></button>
      <div class="g-title"><b id="g-title">vs Pip</b><span id="g-sub">Round 1 of 40</span></div>
      <button class="icon-btn" id="g-sound" aria-label="Sound" aria-pressed="true"></button>
    </div>
    <div class="side top" id="side-opp" data-side="red">
      <div class="face" id="opp-face"></div>
      <div class="nm" id="opp-name">Red<small>to move</small></div>
      <div class="num"><b id="opp-stress">0</b><span>/10</span></div>
      <div class="meter-row"><div class="meter" id="meter-1"></div><span class="incoming" id="inc-1"></span><span class="clock" id="clock-1" hidden></span></div>
      <div class="say" id="opp-say" role="status" hidden></div>
    </div>
    <div class="board-area"><div id="board"></div><div class="banner" id="banner" hidden></div></div>
    <div class="side bottom" id="side-me" data-side="blue">
      <div class="face" id="me-face"></div>
      <div class="nm" id="me-name">You<small>to move</small></div>
      <div class="num"><b id="me-stress">0</b><span>/10</span></div>
      <div class="meter-row"><div class="meter" id="meter-0"></div><span class="incoming" id="inc-0"></span><span class="clock" id="clock-0" hidden></span></div>
    </div>
    <div class="g-bar">
      <button class="btn small" id="btn-undo"><span data-icon="undo"></span>Undo</button>
      <button class="btn small" id="btn-hints" aria-pressed="true"><span data-icon="hint"></span>Hints</button>
      <button class="btn small" id="btn-reset" hidden><span data-icon="reset"></span>Restart</button>
      <button class="btn small gold" id="btn-hint" hidden><span data-icon="hint"></span>Hint</button>
    </div>
  </section>

  <!-- ===== RESULTS ===== -->
  <section class="screen" id="screen-results" aria-live="polite" aria-label="Results"></section>
</main>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="src/rules.js"></script>
<script src="src/ai.js"></script>
<script src="src/solver.js"></script>
<script src="src/rivals.js"></script>
<script src="src/progress.js"></script>
<script src="src/data/puzzles.js"></script>
<script src="src/storage.js"></script>
<script src="src/art.js"></script>
<script src="src/icons.js"></script>
<script src="src/sound.js"></script>
<script src="src/music.js"></script>
<script src="src/haptics.js"></script>
<script src="src/native.js"></script>
<script src="src/fx.js"></script>
<script src="src/board-view.js"></script>
<script src="src/match.js"></script>
<script src="src/tutorial.js"></script>
<script src="src/screens.js"></script>
<script src="src/main.js"></script>
</body>
</html>
